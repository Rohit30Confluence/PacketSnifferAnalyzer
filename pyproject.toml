[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packetsnifferanalyzer"
version = "0.1.0-alpha.1"
description = "A Python-based packet sniffer and traffic analyzer with CLI, GUI, and dashboard visualizer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["network", "packet", "sniffer", "analyzer", "pcap", "traffic", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    # Packet capture and dissection
    "scapy==2.5.0",
    # CLI framework
    "click==8.1.7",
    # Web dashboard backend
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "websockets==12.0",
    # Structured logging
    "structlog==24.1.0",
    # Encryption
    "cryptography==42.0.5",
    "argon2-cffi==23.1.0",
    # Configuration
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "pyyaml==6.0.1",
    # HTTP client (for webhook notifications)
    "httpx==0.27.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6==6.7.0",
    "pyqtgraph==0.13.7",
]
dev = [
    # Testing
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "pytest-qt==4.4.0",
    "pytest-benchmark==4.0.0",
    "httpx==0.27.0",
    # Type checking
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20240311",
    # Linting and formatting
    "ruff==0.4.4",
    # Security scanning
    "bandit[toml]==1.7.8",
    "pip-audit==2.7.3",
    # License checking
    "pip-licenses==4.4.0",
    # Pre-commit
    "pre-commit==3.7.1",
    # Documentation
    "mkdocs==1.6.0",
    "mkdocs-material==9.5.21",
    "mkdocstrings[python]==0.25.1",
]

[project.scripts]
psa = "packetanalyzer.interfaces.cli.app:cli"

[project.urls]
Homepage = "https://gitlab.com/dr-confluence-group/PacketSnifferAnalyzer"
Repository = "https://gitlab.com/dr-confluence-group/PacketSnifferAnalyzer"
Issues = "https://gitlab.com/dr-confluence-group/PacketSnifferAnalyzer/-/issues"
Changelog = "https://gitlab.com/dr-confluence-group/PacketSnifferAnalyzer/-/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"packetanalyzer" = ["py.typed", "interfaces/web/static/**/*"]

# =============================================================================
# Ruff — Linter and Formatter
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ERA", # eradicate (commented-out code)
]
ignore = [
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "S101",   # Use of assert (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"src/packetanalyzer/interfaces/web/static/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["packetanalyzer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy — Static Type Checker
# =============================================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scapy.*", "pyqtgraph.*"]
ignore_missing_imports = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may use PCAP fixtures)",
    "e2e: End-to-end tests",
    "slow: Tests that take more than 5 seconds",
    "gui: Tests requiring a display (PyQt6)",
    "requires_root: Tests requiring elevated privileges",
]
asyncio_mode = "auto"

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "src/packetanalyzer/interfaces/web/static/*",
    "src/packetanalyzer/interfaces/gui/*",  # GUI tested separately
]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# =============================================================================
# Bandit — Security SAST
# =============================================================================
[tool.bandit]
targets = ["src"]
skips = ["B101"]  # assert_used — acceptable in non-test code with justification
